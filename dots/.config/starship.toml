"$schema" = 'https://starship.rs/config-schema.json'
add_newline = false

# Line 1: identity, path, git, timing, toolchains ---------- battery, clock
# Line 2: prompt character
format = """\
  󰣇 \
  $username$hostname\
  $directory\
  $git_branch$git_commit$git_state$git_status\
  $cmd_duration\
  $jobs\
  $sudo\
  $bun\
  $c\
  $cpp\
  $dart\
  $deno\
  $golang\
  $java\
  $kotlin\
  $lua\
  $nodejs\
  $php\
  $python\
  $rust\
  $zig\
  [ ](fg:245)$fill\
  $localip\
  $battery\
  $time\
  $line_break\
  $character"""

continuation_prompt = '▶▶ '

# ── Prompt ───────────────────────────────────────────────

[character]
success_symbol = "[❯](bold fg:#8be9fd)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[fill]
symbol = "-"
style = "fg:245"

[localip]
disabled = false
ssh_only = false
format = " [$localipv4]($style)"
style = "bold yellow"

# ── Identity (only over SSH or as root) ──────────────────

[username]
format = "[$user]($style)"
style_user = "bold yellow"
style_root = "bold red"

[hostname]
format = "[@$hostname]($style) "
style = "bold yellow"

# ── Path ─────────────────────────────────────────────────

[directory]
format = "[$path]($style)[$read_only]($read_only_style)"
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)"
style = "fg:#8be9fd"
before_repo_root_style = "fg:#5f8fa0"
repo_root_style = "bold fg:#8be9fd"
read_only = " 󰌾"
read_only_style = "red"
truncate_to_repo = false

# ── Git ──────────────────────────────────────────────────

[git_branch]
symbol = " "
format = " [$symbol$branch]($style)"
style = "fg:#9198a1"

[git_commit]
format = " [@$hash$tag]($style)"
tag_symbol = " #"
style = "fg:#9198a1"

[git_state]
format = " [$state( $progress_current/$progress_total)]($style)"
style = "bold yellow"

[git_status]
format = "($all_status$ahead_behind)"
conflicted = " [=$count](bold red)"
staged = " [+$count](green)"
modified = " [!$count](yellow)"
renamed = " [»$count](yellow)"
deleted = " [✘$count](red)"
untracked = " [?$count](fg:245)"
stashed = " [≡$count](fg:#769ff0)"
ahead = " [⇡$count](cyan)"
behind = " [⇣$count](cyan)"
diverged = " [⇡$ahead_count⇣$behind_count](cyan)"

# ── Session ──────────────────────────────────────────────

[cmd_duration]
min_time = 2000
format = " [ $duration]($style)"
style = "fg:#a0a9cb"

[jobs]
symbol = "✦"
format = " [$symbol$number]($style)"
style = "bold fg:#769ff0"

[sudo]
disabled = false
symbol = ""
format = " [$symbol]($style)"
style = "bold yellow"

# ── Right side ───────────────────────────────────────────

[battery]
format = " [$percentage $symbol]($style)"
full_symbol = "█"
charging_symbol = "[↑](italic bold green)"
discharging_symbol = "↓"
unknown_symbol = "░"
empty_symbol = "▃"

[[battery.display]]
threshold = 20
style = "italic bold red"

[[battery.display]]
threshold = 60
style = "italic dimmed bright-purple"

[[battery.display]]
threshold = 70
style = "italic dimmed yellow"

[[battery.display]]
threshold = 100
style = "italic dimmed green"

[time]
disabled = false
format = " [ $time]($style)"
style = "fg:#a0a9cb"
time_format = "%R"

# ── Toolchains (shared format: " <icon> <version>") ──────

[bun]
symbol = " "
style = "bold bright-pink"
format = " [$symbol($version)]($style)"

[c]
symbol = " "
style = "bold bright-cyan"
format = " [$symbol($version)]($style)"

[cpp]
symbol = " "
style = "bold bright-cyan"
format = " [$symbol($version)]($style)"

[dart]
symbol = " "
style = "bold bright-cyan"
format = " [$symbol($version)]($style)"

[deno]
symbol = " "
style = "bold green"
format = " [$symbol($version)]($style)"

[golang]
symbol = " "
style = "bold bright-blue"
format = " [$symbol($version)]($style)"

[java]
symbol = " "
style = "bold bright-red"
format = " [$symbol($version)]($style)"

[kotlin]
symbol = " "
style = "bold bright-purple"
format = " [$symbol($version)]($style)"

[lua]
symbol = " "
style = "bold bright-blue"
format = " [$symbol($version)]($style)"

[nodejs]
symbol = " "
style = "bold bright-green"
format = " [$symbol($version)]($style)"
detect_files = [
  "package.json",
  "package-lock.json",
  "pnpm-lock.yaml",
  "yarn.lock",
  ".nvmrc",
  "!bun.lock",
  "!bun.lockb",
  "!bunfig.toml",
]

[php]
symbol = " "
style = "bold bright-purple"
format = " [$symbol($version)]($style)"

[python]
symbol = " "
style = "bold bright-yellow"
format = " [$symbol$pyenv_prefix($version)( \\($virtualenv\\))]($style)"

[rust]
symbol = "󱘗 "
style = "bold bright-red"
format = " [$symbol($version)]($style)"

[zig]
symbol = " "
style = "bold bright-yellow"
format = " [$symbol($version)]($style)"
